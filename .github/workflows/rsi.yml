name: pebble RSI
# CP123 D2: the nightly DETERMINISTIC ($0/tokenless) RSI half — ENABLED cron (not workflow_dispatch-only).
# Runs workflows/rsi.workflow.js: re-verify-tool-matrix (Rule 0) → run-eval-pyramid (no-regression gate) →
# refresh-brain (writes a dated brain/research/proposed-*.md proposal; never auto-merges).
# The Claude half (L3 judge / synthesis) lights up only when CLAUDE_CODE_OAUTH_TOKEN is set (D8 — chairman checklist).
on:
  schedule:
    # 09:17 UTC daily (~02:17 PT) — off the top of the hour to avoid the GH-Actions cron stampede.
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the deterministic RSI half
        env:
          # Token-gated Claude half (D8). Absent on a fresh repo → the runner stays $0 and the deterministic half still runs.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node workflows/rsi.workflow.js
      - name: Surface the proposal
        if: always()
        run: |
          echo "Latest RSI proposal:"
          ls -1 brain/research/proposed-*.md 2>/dev/null | tail -1 || echo "(no proposal written)"
